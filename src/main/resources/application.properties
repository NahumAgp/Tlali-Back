spring.application.name=tlali-back

server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:tlali;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false

tlali.security.jwt.secret=${TLALI_JWT_SECRET:change-this-secret-in-production-at-least-32-chars}
tlali.security.jwt.expires-in-minutes=${TLALI_JWT_EXPIRES_IN_MINUTES:720}
tlali.security.frontend-auth-callback=${TLALI_FRONTEND_AUTH_CALLBACK:http://localhost:5173/auth/callback}
tlali.security.superadmin.email=${TLALI_SUPERADMIN_EMAIL:superadmin@tlali.local}
tlali.security.superadmin.password=${TLALI_SUPERADMIN_PASSWORD:SuperAdmin123!}
tlali.security.superadmin.name=${TLALI_SUPERADMIN_NAME:Super Admin}
tlali.security.device-api-key=${TLALI_DEVICE_API_KEY:tlali-local-device-key}

tlali.firebase.database-url=${TLALI_FIREBASE_DATABASE_URL:https://tlali-5edc4-default-rtdb.firebaseio.com}
tlali.firebase.history-sync.enabled=${TLALI_FIREBASE_HISTORY_SYNC_ENABLED:true}
tlali.firebase.history-sync.fixed-delay-ms=${TLALI_FIREBASE_HISTORY_SYNC_FIXED_DELAY_MS:30000}
tlali.firebase.cleanup.enabled=${TLALI_FIREBASE_CLEANUP_ENABLED:false}
tlali.firebase.cleanup.retention-days=${TLALI_FIREBASE_CLEANUP_RETENTION_DAYS:2}
